name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run headless selftest
        run: uv run adm --selftest

      - name: Build single-file exe
        run: uv run pyinstaller --noconfirm AI-Dialog-Manager.spec

      - name: Rename with version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v',''
          if (-not $tag) { $tag = "dev" }
          Copy-Item dist/AI-Dialog-Manager.exe "AI-Dialog-Manager-$tag.exe"
          "version=$tag" | Out-File -Append $env:GITHUB_ENV -Encoding utf8
          "ARTIFACT=AI-Dialog-Manager-$tag.exe" | Out-File -Append $env:GITHUB_ENV -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT }}
          generate_release_notes: true
          draft: false
          prerelease: false
